<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>章节评论 · 作家助手</title>
<style>
  :root{
    --brand:#1E71EF;           /* Figma 主蓝 */
    --brand-strong:#0562F0;    /* 作家助手品牌主色 */
    --brand-weak:rgba(30,113,239,.12);
    --ink:#141E29;             /* 主文本 */
    --ink-92:rgba(20,30,41,.92);
    --ink-76:rgba(20,30,41,.76);
    --ink-64:rgba(20,30,41,.64);
    --ink-49:rgba(20,30,41,.49);
    --ink-34:rgba(20,30,41,.34);
    --ink-12:rgba(20,30,41,.12);
    --ink-04:rgba(20,30,41,.04);
    --bg:#F9F9FA;
    --panel:#FFFFFF;
    --line:#ECECEE;
    --tabbar:#E4E9EF;
    --shadow:0 1px 3px rgba(20,30,60,.06),0 8px 24px rgba(20,30,60,.05);
    --font:"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --wenkai:"Kaiti SC","STKaiti","KaiTi","LXGW WenKai GB","楷体",serif;
    --num:"Yuewen Font","DIN Alternate","PingFang SC",monospace;
  }
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
    display:flex;flex-direction:column;overflow:hidden;font-size:14px;
  }
  button{font-family:inherit;}

  /* ============ 顶部标题栏（标签 + 窗口控制） ============ */
  .titlebar{
    height:40px;flex:0 0 40px;background:var(--tabbar);
    display:flex;align-items:stretch;padding-left:12px;user-select:none;
  }
  .win-dots{display:flex;align-items:center;gap:8px;padding-right:8px;}
  .win-dots i{width:12px;height:12px;border-radius:50%;display:inline-block;}
  .win-dots .r{background:#FF5F57;} .win-dots .y{background:#FEBC2E;} .win-dots .g{background:#28C840;}
  .tabs{display:flex;align-items:flex-end;gap:1px;flex:1;min-width:0;overflow:hidden;}
  .tab{
    display:flex;align-items:center;gap:7px;height:32px;margin-top:8px;padding:0 12px;
    font-size:12px;color:var(--ink-92);border-radius:8px 8px 0 0;max-width:200px;
    cursor:default;position:relative;
  }
  .tab.active{background:var(--bg);color:var(--ink);font-weight:500;}
  .tab .ti{width:16px;height:16px;border-radius:4px;background:var(--brand);flex:0 0 16px;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;}
  .tab.doc .ti{background:#8B97A8;border-radius:3px;}
  .tab .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tab .close{width:14px;height:14px;border-radius:4px;display:flex;align-items:center;justify-content:center;
    color:var(--ink-49);font-size:12px;opacity:0;transition:.1s;}
  .tab:hover .close{opacity:1;}
  .tab .close:hover{background:var(--ink-12);}
  .titlebar-right{display:flex;align-items:center;gap:10px;padding:0 10px;font-size:12px;color:var(--ink-49);}
  .win-ctrl{display:flex;align-items:center;height:100%;}
  .win-ctrl span{width:46px;display:flex;align-items:center;justify-content:center;color:var(--ink-64);
    cursor:default;height:100%;font-size:15px;}
  .win-ctrl span:hover{background:var(--ink-04);}
  .win-ctrl span.close-w:hover{background:#E81123;color:#fff;}

  /* ============ 工具栏 ============ */
  .toolbar{
    height:48px;flex:0 0 48px;background:var(--panel);border-bottom:1px solid rgba(20,30,41,.08);
    display:flex;align-items:center;gap:4px;padding:0 16px 0 4px;
  }
  .tb-btn{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:4px;
    font-size:14px;color:var(--ink-76);cursor:pointer;border:none;background:transparent;white-space:nowrap;}
  .tb-btn:hover{background:var(--ink-04);}
  .tb-btn svg{width:16px;height:16px;}
  .tb-sep{width:1px;height:20px;background:rgba(20,30,41,.08);margin:0;}
  .tb-spacer{flex:1;}
  .tb-publish{background:var(--brand);border:1px solid var(--brand);color:rgba(255,255,255,.92);
    font-weight:400;padding:0 12px;height:32px;border-radius:4px;cursor:pointer;font-size:14px;width:102px;}
  .tb-publish:hover{background:var(--brand-strong);border-color:var(--brand-strong);color:#fff;}

  /* ============ 主区域 ============ */
  .body-row{flex:1;display:flex;min-height:0;}

  /* ---- 左侧章节面板 ---- */
  .leftpanel{width:255px;flex:0 0 255px;background:var(--panel);border-right:1px solid rgba(20,30,41,.08);order:-2;
    display:flex;flex-direction:column;min-height:0;}
  .lp-search{padding:12px 12px 5px;}
  .lp-search .box{display:flex;align-items:center;gap:6px;height:32px;background:var(--ink-04);
    border:1px solid rgba(20,30,41,.08);border-radius:4px;padding:0 10px;color:var(--ink-34);font-size:14px;}
  .lp-search .box svg{width:16px;height:16px;}
  .lp-new{display:flex;gap:8px;padding:4px 12px;}
  .lp-new button{flex:1;min-width:0;height:28px;border-radius:4px;font-size:12px;cursor:pointer;padding:0 12px;}
  .lp-new .primary{background:var(--brand);color:rgba(255,255,255,.92);border:none;font-weight:400;}
  .lp-new .ghost{background:var(--panel);border:1px solid var(--ink-12);color:var(--ink-76);}
  .lp-tabs{height:38px;display:flex;align-items:flex-start;gap:8px;padding:8px 6px 2px;font-size:12px;color:var(--ink-92);}
  .lp-tabs .t{height:28px;display:inline-flex;align-items:center;cursor:pointer;padding:0 4px 2px;}
  .lp-tabs .t.on{color:var(--ink-92);font-weight:400;box-shadow:inset 0 -2px 0 var(--brand);}
  .lp-tabs .more{margin-left:auto;color:var(--ink-34);}
  .lp-list{flex:1;overflow-y:auto;padding:0 4px 8px;}
  .lp-group{display:flex;align-items:center;gap:4px;height:30px;padding:4px 8px;font-size:13px;color:var(--ink-92);cursor:default;}
  .lp-group .cnt{margin-left:auto;font-size:11px;color:var(--ink-34);}
  .lp-group svg{width:16px;height:16px;color:var(--ink-64);flex:0 0 16px;}
  .lp-item{display:flex;align-items:center;gap:4px;height:30px;padding:4px 8px;font-size:13px;
    color:var(--ink-64);cursor:pointer;border-radius:3px;margin:0;position:relative;}
  .lp-item.no-glyph{padding-left:28px;}
  .lp-item:hover{background:var(--ink-04);}
  .lp-item.active{height:28px;background:var(--brand-weak);color:var(--ink-92);font-weight:500;}
  .lp-item .dot{width:16px;height:16px;border-radius:50%;border:1px solid var(--ink-34);flex:0 0 16px;position:relative;}
  .lp-item .dot::after{content:"";position:absolute;left:4px;top:4px;width:6px;height:3px;border-left:1px solid var(--ink-34);border-bottom:1px solid var(--ink-34);transform:rotate(-45deg);}
  .lp-item .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
  .lp-item .pic{width:14px;height:14px;color:var(--ink-49);flex:0 0 14px;}
  .lp-item .wc{font-size:11px;color:var(--ink-34);font-family:var(--num);}

  /* ---- 中间容器 ---- */
  .center{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;background:var(--bg);}
  .editor-scroll{flex:1;overflow-y:auto;display:flex;justify-content:center;padding:32px 24px 60px;}
  .paper{width:100%;max-width:1009px;}
  .title-input{
    width:100%;border:none;outline:none;background:transparent;
    font-family:var(--wenkai);font-size:28px;font-weight:700;color:var(--ink-92);
    line-height:1.35;padding:0;letter-spacing:.5px;margin-bottom:26px;
  }
  .title-input::placeholder{color:var(--ink-34);}
  .body-input{
    width:100%;min-height:60vh;border:none;outline:none;resize:none;background:transparent;
    font-family:var(--wenkai);font-size:20px;font-weight:400;color:var(--ink-92);
    line-height:2.0;letter-spacing:.5px;
  }
  .body-input::placeholder{color:var(--ink-34);}

  /* ---- 底部状态栏 ---- */
  .statusbar{height:26px;flex:0 0 26px;background:var(--bg);border-top:1px solid var(--line);
    display:flex;align-items:center;gap:0;padding:0 14px;font-size:12px;color:var(--ink-64);}
  .sb-item{display:flex;align-items:center;gap:5px;}
  .sb-item svg{width:13px;height:13px;}
  .sb-plan{margin:0 auto;display:flex;align-items:center;gap:6px;color:var(--ink-92);}
  .sb-plan .ring{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink-12);
    border-top-color:var(--brand);}
  .sb-right{display:flex;align-items:center;gap:14px;margin-left:auto;}
  .sb-right .k{color:var(--ink-34);}
  .sb-right .v{font-family:var(--num);color:var(--ink-76);}

  /* ---- 右侧竖排图标栏（始终在最右侧） ---- */
  .rightrail{width:48px;flex:0 0 48px;background:var(--panel);border-left:1px solid rgba(20,30,41,.08);
    display:flex;flex-direction:column;align-items:center;padding-top:0;gap:4px;order:2;}
  .rr-btn{width:48px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;
    font-size:10px;line-height:14px;color:var(--ink-64);cursor:pointer;border-radius:0;}
  .rr-btn:hover{background:var(--ink-04);color:var(--brand);}
  .rr-btn svg{width:16px;height:16px;}
  .rr-line{width:20px;height:1px;background:rgba(20,30,41,.08);flex:0 0 1px;}


  /* ============ 章节阅读视图（含段评气泡 / 评论抽屉） ============ */
  /* 章节头部（讨论热词 + 标题章评数 + 元信息） */
  /* 章节头部元信息（讨论热词 + 章评总数）默认隐藏；仅评论模式显示 */
  .chap-meta{display:none;align-items:center;gap:8px;margin-bottom:14px;font-size:12px;color:var(--ink-64);flex-wrap:wrap;}
  body.comment-mode .chap-meta{display:none;}
  .chap-meta .hot{display:flex;align-items:center;gap:5px;color:var(--ink-76);font-weight:500;}
  .chap-meta .hot svg{width:13px;height:13px;color:#FF7A45;}
  .chap-meta .hot-tag{background:#FFE7DC;color:#E84D2F;border-radius:10px;padding:2px 8px;font-size:11.5px;font-weight:500;}
  .chap-meta .chap-sep{color:var(--ink-12);}
  .chap-meta .chap-stat{display:flex;align-items:center;gap:4px;color:var(--ink-64);}
  .chap-meta .chap-stat .dot{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.4;}

  .chap-title-row{display:flex;align-items:center;gap:14px;margin-bottom:8px;}
  .chap-title{font-family:var(--wenkai);font-size:28px;font-weight:700;color:var(--ink-92);line-height:36px;letter-spacing:0;margin:0;}
  /* 章节标题气泡与正文段落气泡保持同一套描边角标样式。 */
  .chap-bubble{
    display:none;align-items:center;justify-content:center;box-sizing:border-box;
    height:18px;min-width:18px;width:auto;line-height:16px;padding:0 3px;
    margin-left:4px;border-radius:3px;border:1px solid currentColor;
    background:rgba(255,255,255,.7);font-size:11px;font-weight:600;color:#ff3b4f;
    cursor:pointer;text-indent:0;user-select:none;font-family:var(--num);
    font-variant-numeric:tabular-nums;vertical-align:baseline;
    transition:background .15s, box-shadow .15s, color .15s, border-color .15s;
  }
  body.comment-mode .chap-bubble{display:inline-flex;}
  .chap-bubble:hover{background:#fff;box-shadow:0 2px 5px rgba(255,59,79,.18);}
  .chap-bubble.lv-red{color:#ff3b4f;background:rgba(255,255,255,.7);}
  .chap-bubble.lv-amber{color:#C87A16;background:rgba(255,255,255,.7);}
  .chap-bubble.lv-mute{color:#6f737a;background:rgba(255,255,255,.58);}

  .chap-info{display:flex;align-items:center;gap:4px;font-size:12px;line-height:16px;color:var(--ink-49);margin-bottom:32px;white-space:nowrap;}
  .chap-info .item{display:flex;align-items:center;gap:4px;}
  .chap-info .sep{color:var(--ink-34);padding:0 8px;}

  /* 段落渲染（reader）：每段独立段落 + 行尾段评气泡 */
  /* reader 始终显示（关评论模式时正文也要在，只是不显示气泡/抽屉）*/
  .reader{display:flex;flex-direction:column;}
  .para-list{display:flex;flex-direction:column;gap:2px;}
  .para{
    position:relative;padding:8px 14px 8px 18px;border-radius:8px;cursor:default;
    line-height:2.0;letter-spacing:.5px;font-family:var(--wenkai);font-size:20px;color:var(--ink-92);
    text-indent:2em;margin:0;
    transition:background-color .22s ease, box-shadow .22s ease;
  }
  /* 段落高亮默认无视觉；仅评论模式才出现选中态 */
  .para.active{background:transparent;box-shadow:none;}
  body.comment-mode .para.active{
    background:linear-gradient(90deg, rgba(255,121,80,.16) 0%, rgba(255,121,80,.05) 100%);
    box-shadow:inset 4px 0 0 #FF7A45;
  }
  body.comment-mode .para.hover-preview,
  body.comment-mode .chap-title-row.active,
  body.comment-mode .chap-title-row.hover-preview{
    background:linear-gradient(90deg, rgba(30,113,239,.12) 0%, rgba(30,113,239,.04) 100%);
    box-shadow:inset 4px 0 0 var(--brand);
  }
  body.comment-mode .chap-title-row.active,
  body.comment-mode .chap-title-row.hover-preview{
    border-radius:8px;padding:8px 14px 8px 18px;margin-left:-18px;
  }
  /* 对话段落（以引号开头）不加额外 class 缩进处理，与叙述段一致首行缩进 2em */
  /* 评论里的 emoji */
  .emo{font-style:normal;}
  /* 段评气泡默认隐藏；仅评论模式渲染（关掉评论=干净正文）*/
  /* 参考章节正文里的描边角标：数字按内容自适应，flex 居中避免偏上。*/
  .para-bubble{display:none;align-items:center;justify-content:center;
    box-sizing:border-box;height:18px;min-width:18px;width:auto;line-height:16px;padding:0 3px;
    margin-left:4px;border-radius:3px;border:1px solid currentColor;background:rgba(255,255,255,.7);
    font-size:11px;font-weight:600;color:#ff3b4f;cursor:pointer;text-indent:0;
    user-select:none;font-family:var(--num);font-variant-numeric:tabular-nums;vertical-align:baseline;}
  body.comment-mode .para-bubble{display:inline-flex;}
  .para-bubble:hover{background:#fff;box-shadow:0 2px 5px rgba(255,59,79,.18);}
  /* 热度分级（PRD §8.4 三档红系渐进）：<30 灰、30–99 琥珀、≥100 品牌红；描边 border 用 currentColor 自动跟随。 */
  .para-bubble.lv-red{color:#ff3b4f;background:rgba(255,255,255,.7);}
  .para-bubble.lv-amber{color:#C87A16;background:rgba(255,255,255,.7);}
  .para-bubble.lv-mute{color:#6f737a;background:rgba(255,255,255,.58);}

  /* 评论抽屉（默认折叠）；展开为评论主区域。
     order:让 leftpanel(-2) < center(0 默认) < cm-drawer(1) < rightrail(2)，
     抽屉展开时插入到 center 与 rightrail 之间，rightrail 始终贴 viewport 右。 */
  .cm-drawer{
    flex:0 0 0;width:0;background:var(--panel);border-left:1px solid var(--line);
    display:none;flex-direction:column;min-height:0;overflow:hidden;order:1;
    transition:flex-basis .28s ease, width .28s ease;
  }
  body.comment-mode .cm-drawer{display:flex;}
  body.comment-mode .cm-drawer.open{flex:0 0 320px;width:320px;}
  .cm-hd{
    height:42px;display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px 6px;border-bottom:0;flex:0 0 42px;
  }
  .cm-hd .cm-title{display:flex;align-items:center;gap:8px;font-size:16px;line-height:24px;font-weight:500;color:var(--ink);}
  .cm-hd .cm-title .cnt{font-size:12px;line-height:18px;color:var(--ink-64);font-weight:400;margin-left:0;font-family:var(--num);}
  .cm-hd .cm-close{
    width:28px;height:24px;display:flex;align-items:center;justify-content:center;
    border-radius:8px;cursor:pointer;color:var(--ink-49);font-size:18px;line-height:1;
  }
  .cm-hd .cm-close:hover{background:var(--ink-04);color:var(--ink);}

  /* 工具栏按 Figma 74-23081：space-between（tab list 居左，筛选+更多按钮组居右） */
  .cm-toolbar{
    height:32px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 16px;
    border-bottom:0;font-size:12px;line-height:18px;color:var(--ink-64);flex:0 0 32px;
  }
  .cm-toolbar .cm-sort{display:flex;align-items:center;gap:8px;min-width:0;}
  .cm-toolbar .cm-tab{height:28px;display:inline-flex;align-items:center;cursor:pointer;padding:0;white-space:nowrap;}
  .cm-toolbar .cm-tab.on{color:var(--ink-92);font-weight:400;box-shadow:inset 0 -2px 0 var(--brand);}
  /* 右侧按钮组：Figma frame 74-23105 为 row 无间距，两个 28x28 icon button 紧挨 */
  .cm-toolbar .cm-actions{display:flex;align-items:center;flex:0 0 auto;}
  .cm-toolbar .cm-filter,
  .cm-toolbar .cm-more{
    width:28px;height:28px;border:0;background:transparent;color:var(--ink-64);
    display:flex;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;padding:0;
  }
  .cm-toolbar .cm-more svg{width:18px;height:18px;display:block;}
  .cm-toolbar .cm-filter:hover{background:var(--ink-04);color:var(--brand);}
  .cm-toolbar .cm-more:hover{background:var(--ink-04);color:var(--brand);}
  .cm-toolbar .cm-filter.on{background:var(--brand-weak);color:var(--brand);}
  .cm-toolbar .cm-filter svg{width:16px;height:16px;}
  /* toolbar 菜单：点击 trigger 切换 .open，popover 在 wrap 外侧下方 4px；点 wrap 外部关闭
     （PRD §18 改版：原 hover 触发改为 click，避免鼠标穿越 4px 间隙导致闪烁/误触发）。
     popover 显示完全靠 .open / :focus-within，不依赖 CSS :hover，保证 hover 不再打开菜单。 */
  .cm-menu-wrap{position:relative;display:inline-flex;align-items:center;}
  .cm-popover{
    position:absolute;top:100%;right:0;margin-top:4px;
    min-width:140px;background:#fff;border:.5px solid var(--color-border-tertiary);border-radius:8px;
    box-shadow:0 4px 16px rgba(0,0,0,.08);padding:4px 0;
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .12s ease;z-index:9999;
  }
  .cm-menu-wrap.open .cm-popover,
  .cm-menu-wrap:focus-within .cm-popover{opacity:1;visibility:visible;pointer-events:auto;}
  /* open 态下按钮轻微视觉强调（背景轻微提亮） */
  .cm-menu-wrap.open > button{background:rgba(20,30,41,0.04);}
  .cm-popover-floating{
    position:fixed;top:0;left:0;margin:0;width:160px;
    display:none;
  }
  .cm-popover-floating[data-open="1"]{display:block;opacity:1;visibility:visible;pointer-events:auto;}
  .cm-menu-item{
    display:block;width:100%;padding:8px 14px;font-size:13px;color:var(--ink-92);
    text-align:left;background:transparent;border:0;cursor:pointer;line-height:1.5;
    font-family:var(--font);
  }
  .cm-menu-item:hover{background:var(--ink-04);color:var(--brand);}
  /* 全局 toast（PRD §18.1）：菜单点击统一占位「开发中」 */
  .cm-toast{
    position:fixed;top:24px;left:50%;transform:translateX(-50%);
    padding:8px 16px;background:rgba(20,30,41,.92);color:#fff;border-radius:6px;
    font-size:13px;opacity:0;pointer-events:none;
    transition:opacity .2s ease;z-index:100000;box-shadow:0 4px 12px rgba(0,0,0,.18);
  }
  .cm-toast[data-open="1"]{opacity:1;}
  .cm-toolbar .cm-back{
    display:none;align-items:center;gap:4px;cursor:pointer;color:var(--brand);font-size:14px;font-weight:400;white-space:nowrap;
  }
  .cm-toolbar .cm-back svg{width:16px;height:16px;}
  .cm-drawer.parasec .cm-toolbar{gap:8px;}
  .cm-drawer.parasec .cm-toolbar .cm-back{display:none;}
  .cm-drawer.parasec .cm-toolbar .cm-sort{gap:8px;}
  /* 此读者视图（PRD §19 + Figma 110-9333 / 110-9372）：保留排序 tab；隐藏标签栏；顶部 frame
     包裹 8px 16px padding；引用行样式同 parasec 单对象视图（8px 16px 灰底圆角）。
     「返回全部评论」按钮按 Figma 110-9372 capsule option：1px brand 边框 + 100px 圆角。 */

  function bindCommentListScroll(){

    list.dataset.scrollBound = '1';
    list.addEventListener('scroll', function(){

  function ensureTooltip(){
    if(tooltipEl) return tooltipEl;

    tooltipEl.id = 'cmTooltip';
    tooltipEl.setAttribute('role', 'tooltip');
    document.body.appendChild(tooltipEl);
    return tooltipEl;
  }
  function showTooltip(anchor, text){
    var el = ensureTooltip();
    el.textContent = text;
    el.style.display = 'block';
    var r = anchor.getBoundingClientRect();
    var tw = el.offsetWidth, th = el.offsetHeight;
    var left = Math.max(4, Math.min(window.innerWidth - tw - 4, r.left + r.width/2 - tw/2));
    var top = r.top - th - 8;
    if(top < 4) top = r.bottom + 8;   // 上方放不下时翻到下方
    el.style.left = left + 'px';
    el.style.top = top + 'px';
  }
  function hideTooltip(){
    if(tooltipEl) tooltipEl.style.display = 'none';
  }

  /* 创建便签 DOM。MVP 演示版标题栏只有右上角关闭按钮（PRD §17.2）；
     内容区 contenteditable 支持直接编辑（PRD §17.2.6） */
  function createNoteDom(contentHtml, noteKey){
    var note = document.createElement('div');
    note.className = 'cm-note';
    if(noteKey) note.dataset.noteKey = noteKey;   // 关闭时从 savedNoteKeys 清除（PRD §17.1.4 重新打开）
    var off = 16 * (noteCount % 10);          // 偏移叠放（PRD §17.3.2）
    note.style.left = off + 'px';
    note.style.top = off + 'px';
    note.style.zIndex = ++noteZ;
    note.innerHTML = '<div class="cm-note-head">'
      + '<button class="cm-note-close" type="button" title="关闭便签">'+ICON_CLOSE_L+'</button>'
      + '</div>'
      + '<div class="cm-note-body" contenteditable="true" spellcheck="false">'+(contentHtml || '')+'</div>';
    noteCount++;
    bindNoteEvents(note);
    document.body.appendChild(note);
    return note;
  }
  function bindNoteEvents(note){
    // 点击便签任意位置 → 置顶（PRD §17.3.3）；不 preventDefault 保证内容区可编辑定位光标
    note.addEventListener('pointerdown', function(){
      note.style.zIndex = ++noteZ;
    });
    // 拖动：从标题栏发起（内容区留给编辑，PRD §17.4）
    var head = note.querySelector('.cm-note-head');
    var drag = null;
    head.addEventListener('pointerdown', function(e){
      if(e.target.closest('.cm-note-close')) return;
      drag = { x: e.clientX, y: e.clientY,
               left: parseFloat(note.style.left) || 0,
               top: parseFloat(note.style.top) || 0,
               moved: 0 };
      head.setPointerCapture && head.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    head.addEventListener('pointermove', function(e){
      if(!drag) return;
      var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      drag.moved = Math.max(drag.moved, Math.abs(dx) + Math.abs(dy));
      var nl = drag.left + dx, nt = drag.top + dy;
      // 限制不完全拖出视口
      nl = Math.max(-223, Math.min(window.innerWidth - 40, nl));
      nt = Math.max(0, Math.min(window.innerHeight - 40, nt));
      note.style.left = nl + 'px';
      note.style.top = nt + 'px';
    });
    function endDrag(){
      if(drag && drag.moved > 4){
        // 拖动后抑制标题栏 click 冒泡，避免误触按钮
        var suppress = function(ev){ ev.stopPropagation(); };
        head.addEventListener('click', suppress);
        setTimeout(function(){

      }
    }
    head.addEventListener('pointerup', endDrag);
    head.addEventListener('pointercancel', endDrag);
    // 关闭按钮：移除便签并清除防重复标记，允许同一评论重新打开便签
    note.querySelector('.cm-note-close').addEventListener('click', function(e){
      e.stopPropagation();
      if(note.dataset.noteKey) delete savedNoteKeys[note.dataset.noteKey];
      note.remove();
    });
  }
  /* 按 id 查找评论（含一级/回复/未匹配对象），用于便签正文 */
  function findCommentById(cid){
    var idx = ensureCommentIndex();
    var pools = [idx.chapterTarget];
    Object.keys(idx.targetMap).forEach(function(k){ pools.push(idx.targetMap[k]); });
    var found = null;
    pools.some(function(t){
      return (t.items || []).some(function(c){
        if(String(commentKey(c)) === cid){ found = c; return true; }
        return (c.replies || []).some(function(r){
          if(String(commentKey(r)) === cid){ found = r; return true; }
          return false;
        });
      });
    });
    return found;
  }
  /* 点击 plus 按钮：保存 + 弹出便签（PRD §17.1.3）
     内容渲染顺序（PRD §17.2.4）：正文在前 + 空行 + ——用户{guid}在…的评论 */
  function openInspirationNote(btn){
    var cid = btn.getAttribute('data-cid');
    var guid = btn.getAttribute('data-guid') || '';
    if(savedNoteKeys[cid]){
      return; // 已保存：只提示，不重复创建
    }
    savedNoteKeys[cid] = true;
    var found = findCommentById(cid);
    var bodyHtml = found ? commentBodyHtml(found) : '';
    var signature = '<br><br>——用户'+escapeHtml(guid)+'在《没钱修什么仙》第1章 面试的评论';
    createNoteDom(bodyHtml + signature, cid);
  }
  /* 灵感便签按钮事件委托（技术方案 §5.9.5）：click + hover tooltip */
  function bindInspirationNoteButtons(){
    var drawer = $('#cmDrawer');
    if(!drawer || drawer.dataset.noteBound === '1') return;
    drawer.dataset.noteBound = '1';
    var hoverTimer = null;
    drawer.addEventListener('mouseover', function(e){
      var btn = e.target.closest('.cm-meta-note');
      if(!btn || tooltipLock) return;
      clearTimeout(hoverTimer);
      hoverTimer = setTimeout(function(){
        if(!tooltipLock) showTooltip(btn, '存为灵感便签');
      }, 300);
    });
    drawer.addEventListener('mouseout', function(e){
      var btn = e.target.closest('.cm-meta-note');
      if(!btn || tooltipLock) return;
      clearTimeout(hoverTimer);
      hideTooltip();
    });
    drawer.addEventListener('click', function(e){
      var btn = e.target.closest('.cm-meta-note');
      if(!btn) return;
      clearTimeout(hoverTimer);
      tooltipLock = true;
      showTooltip(btn, '已保存');
      openInspirationNote(btn);
      clearTimeout(tooltipHideTimer);
      tooltipHideTimer = setTimeout(function(){
        tooltipLock = false;
        hideTooltip();
      }, 1500);
    });
  }

  // 2) 渲染 reader（按段渲染，气泡挂在段落末尾）
  function renderReader(){

    // 评论抽屉默认显示全章有效评论总数（一级+回复，不含孤儿）；选中对象后切换为该对象计数。

  // 3) 段选择联动：气泡→段落高亮 + 评论抽屉切换到单对象视图
  function selectParagraph(idx){
    enterTargetView(idx);
  }
  /* 标签复位为"全部"（点击评论对象进入单对象视图时，PRD §13.2-3） */
  function resetTagToAll(){
    currentCommentTag = '全部';
    $$('#cmTags .cm-tag').forEach(function(t){ t.classList.remove('on'); });
    var allTag = $$('#cmTags .cm-tag').filter(function(t){ return (t.getAttribute('data-tag') || '全部') === '全部'; })[0];
    if(allTag) allTag.classList.add('on');
  }
  /* 进入单对象评论视图：正文定位高亮 + 抽屉只显示该对象全部一级评论（PRD §12） */
  function enterTargetView(targetId){
    var p = getParagraphByTarget(targetId);
    if(!p) return;
    if(!COMMENT_DATA_READY){
      loadCommentData().then(function(){
        enterTargetView(targetId);
      });
      var listLoading = $('#cmList');
      if(listLoading) listLoading.innerHTML = '<div class="cm-empty">评论加载中...</div>';
      return;
    }
    var drawer = $('#cmDrawer');
    // 进入前记录聚合视图滚动位置（仅从聚合态进入时才保存，避免被单对象视图内部滚动覆盖）
    if(drawer && !drawer.classList.contains('parasec')){
      var list0 = $('#cmList');
      if(list0) savedAllCommentsScrollTop = list0.scrollTop;
    }
    // 同步保存正文滚动位置（scrollIntoView 之前），返回时恢复避免正文跳转（PRD §12）
    var editorScroller = $('.editor-scroll');
    if(editorScroller) savedEditorScrollTop = editorScroller.scrollTop;
    drawer.classList.add('open');
    // （1）清空旧高亮，应用新高亮并滚动定位
    // 定位用 auto（瞬时）：smooth 动画会残留多帧，返回时恢复滚动位置会被动画拉偏（PRD §12）
    $$('.para').forEach(function(el){ el.classList.remove('active'); });
    var titleRow = $('.chap-title-row');
    if(titleRow) titleRow.classList.remove('active');
    if(targetId === -1){
      if(titleRow){
        titleRow.classList.add('active');
        try{ titleRow.scrollIntoView({behavior:'auto', block:'center'}); }catch(e){ titleRow.scrollIntoView(); }
      }
    } else {
      var para = $('.para[data-idx="'+targetId+'"]');
      if(para){
        para.classList.add('active');
        try{ para.scrollIntoView({behavior:'auto', block:'center'}); }catch(e){ para.scrollIntoView(); }
      }
    }
    // （2）标签筛选状态复位为"全部"（以评论对象筛选为主）
    if(currentCommentTag !== '全部'){ resetTagToAll(); }
    // （3）抽屉进入单对象视图；评论列表自动回到顶部，不受之前滚动位置影响
    drawer.classList.add('parasec');
    renderTargetComments(targetId);
    var list = $('#cmList');
    if(list) list.scrollTop = 0;
  }

  // 4) 渲染单对象评论列表：该对象下全部一级评论（不截断），楼中楼默认收起
  function renderTargetComments(targetId){
    var list = $('#cmList');
    var context = $('#cmContext');
    if(!COMMENT_DATA_READY){
      if(COMMENT_DATA_ERROR) renderCommentsError(); else renderCommentsLoading();
      return;
    }
    var idx = ensureCommentIndex();
    var target = targetId === -1 ? idx.chapterTarget : idx.targetMap[String(targetId)];
    if(!target) return;
    var paras = getParagraphs();
    currentParagraphIdx = targetId;
    var items = sortComments(target.items.slice());
    setCommentHeader('评论', target.totalCount+'条');
    var quoteText = targetId === -1
      ? CHAPTER.title
      : (paras[targetId] || target.targetText || '');
    var pTag = '<div class="cm-section-module single">'
      + '<div class="cm-quote">'
      +   '<span class="cm-quote-text">原文：'+escapeHtml(quoteText)+'</span>'
      +   '<button class="cm-quote-back" type="button">'
      +     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 10l-4 4 4 4"/><path d="M5 14h9a5 5 0 0 0 0-10h-2"/></svg>'
      +     '返回全部评论'
      +   '</button>'
      + '</div>'
      + '</div>';
    var body = items.map(function(c, index){
      return renderParagraphCommentItem(c, index);
    }).join('');
    if(context) context.innerHTML = pTag;
    if(items.length === 0){
      list.innerHTML = '<div class="cm-empty">本对象暂无评论，做第一个评论的人吧～</div>';
    } else {
      list.innerHTML = body;
    }
    var back = $('.cm-quote-back', context || list);
    if(back) back.addEventListener('click', returnToAllComments);
    bindReplyToggles();
    bindInspirationNoteButtons();   // 灵感便签（PRD §17，单对象视图同样可用）
  }

  // 5) 渲染全部评论（PRD §10）
  // default：章评 → 段落序 → 未匹配；hot：聚合块按对象总评论数降序；latest：拍平单条流
  function renderAllComments(){
    var list = $('#cmList');
    var context = $('#cmContext');
    var drawer = $('#cmDrawer');
    if(drawer) drawer.classList.remove('parasec');
    if(context) context.innerHTML = '';
    currentParagraphIdx = null;
    var idx = ensureCommentIndex();
    var validTotal = idx.chapterTarget.totalCount + idx.paragraphTotalCount;
    setCommentHeader('评论', validTotal+'条');
    renderCommentTags();
    bindCommentListScroll();
    if(!COMMENT_DATA_READY){
      if(COMMENT_DATA_ERROR) renderCommentsError(); else renderCommentsLoading();
      return;
    }

    // 标签过滤：只以一级评论为筛选主体（PRD §11.3）
    var tagFilter = currentCommentTag === '全部' ? null : currentCommentTag;
    function visibleItemsOf(target){
      if(!tagFilter) return target.items;
      return target.items.filter(function(c){
        return commentTags(c).indexOf(tagFilter) >= 0;
      });
    }

    var html = '';
    // 顶部 AI 总结卡仅在"全部"筛选 + 默认排序下显示；筛选态只展示真实命中，
    // 最热/最新排序为作者主动切换的浏览模式，不展示 AI 卡（PRD §10.4）
    if(currentCommentTag === '全部' && currentCommentSort === 'default'){
      html += renderAiSummaryCard();
    }

    if(currentCommentSort === 'latest' || currentCommentSort === 'long'){
      // 最新/长评：不按评论对象聚合块；把命中的一级评论拍平成单条流，按 sortComments 排序
      // （最新 = createdAt 倒序，长评 = 正文字数倒序；PRD §10.4.3 / §10.4.4）
      // 分页：首次只渲染 FLAT_PAGE_SIZE 条 + 哨兵 div，触底自动加载下一批。
      var flatFull = getFlatSorted(idx);
      flatPageIndex = 0;
      var endIdx = Math.min(flatFull.length, FLAT_PAGE_SIZE);
      html += renderFlatPageHTML(flatFull, 0, endIdx, idx);
      if(endIdx < flatFull.length){
        // 哨兵：IntersectionObserver 触底加载；全部加载后由 loadMoreFlat 隐藏
        html += '<div class="cm-flat-sentinel" data-flat-sentinel></div>';
      }
    } else {
      // default / hot：按评论对象聚合。先收集块，再按排序决定块顺序。
      var blocks = [];
      var chapVisible = visibleItemsOf(idx.chapterTarget);
      if(chapVisible.length) blocks.push({target: idx.chapterTarget, visible: chapVisible, unmatched: false});
      idx.targets.forEach(function(t){
        var visible = visibleItemsOf(t);
        if(visible.length) blocks.push({target: t, visible: visible, unmatched: false});
      });
      Object.keys(idx.targetMap).forEach(function(key){
        var t = idx.targetMap[key];
        if(!t.unmatched) return;
        var visible = visibleItemsOf(t);
        if(visible.length) blocks.push({target: t, visible: visible, unmatched: true});
      });
      if(currentCommentSort === 'hot'){
        // 最热：聚合块按对象总评论数（含回复）从高到低；未匹配仍排最后（PRD §10.4.2）
        blocks.sort(function(a,b){
          if(!!a.unmatched !== !!b.unmatched) return a.unmatched ? 1 : -1;
          return b.target.totalCount - a.target.totalCount;
        });
      }
      blocks.forEach(function(b){
        if(b.unmatched){
          html += renderUnmatchedModule(b.target, sortComments(b.visible));
        } else {
          html += renderFullCommentModule(b.target.targetId, sortComments(b.visible), b.target.totalCount);
        }
      });
    }
    html += '<div class="cm-empty">-到底了-</div>';
    list.innerHTML = html;
    // flat 视图分页：若还有未渲染的，先隐藏 -到底了-，挂哨兵 observer 让触底自动加载
    if(currentCommentSort === 'latest' || currentCommentSort === 'long'){
      var flatFull2 = flatCache[getFlatCacheKey()];
      var emptyEl = list.querySelector('.cm-empty');
      if(flatFull2 && flatPageIndex * FLAT_PAGE_SIZE < flatFull2.length){
        if(emptyEl) emptyEl.style.display = 'none';
      } else if(emptyEl){
        emptyEl.style.display = '';
      }
    }
    bindReplyToggles();
    bindTargetAnchors();
    bindAiSummaryExpand();
    bindInspirationNoteButtons();   // 灵感便签（PRD §17）
    setupFlatSentinelObserver();   // flat 视图分页：触底自动加载下一批
  }
  /* AI 总结卡【展开全部/收起全文】切换按钮（Figma 92-13358）
     点击展开后重渲染；收起后列表回到顶部（AI 卡是首项，回顶即可看到） */
  function bindAiSummaryExpand(){
    var btn = $('.cm-ai-expand');
    if(!btn) return;
    btn.addEventListener('click', function(){
      var willCollapse = aiSummaryExpanded;        // 当前已展开 → 即将收起
      aiSummaryExpanded = !aiSummaryExpanded;
      renderAllComments();
      if(willCollapse){
        var list = $('#cmList');
        if(list) list.scrollTop = 0;
      }
    });
  }
  /* 未匹配评论对象块：CSV targetId 超出正文段落范围 */
  function renderUnmatchedModule(target, comments){
    var top = comments.slice(0, 3);
    var more = comments.length > 3
      ? '<button class="cm-section-link" type="button" disabled>查看'+comments.length+'条评论<svg width="10" height="10" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1.06595 2.74264C0.755577 3.06616 0.755577 3.59069 1.06595 3.91421L4.15686 7.13604C4.62242 7.62132 5.37725 7.62132 5.84281 7.13604L8.93372 3.91421C9.2441 3.59069 9.2441 3.06616 8.93372 2.74264C8.62335 2.41912 8.12013 2.41912 7.80976 2.74264L4.99984 5.67157L2.18992 2.74264C1.87954 2.41912 1.37633 2.41912 1.06595 2.74264Z" fill="#141E29" fill-opacity="0.34"/></svg></button>'
      : '';
    return '<section class="cm-full-module cm-unmatched-module">'
      + '<div class="cm-reference" title="评论对象无法匹配正文">'
      +   '<span class="cm-quote-text">原文（未匹配 · 对象'+target.targetId+'）：'+escapeHtml(target.targetText || '')+'</span>'
      +   '<span class="cm-ref-bubble '+heatClass(target.totalCount)+'">'+displayCount(target.totalCount)+'</span>'
      + '</div>'
      + top.map(function(c, index){ return renderFullCommentItem(c, index); }).join('')
      + more
      + '</section>';
  }
  /* 聚合块锚点交互：hover 滚动定位 + 临时高亮；click 进单对象视图（PRD §13）
     hover 防误触（PRD §13.1.1）：指针轨迹判定（hover intent）——
     mouseenter 后 200ms 观察窗内累计位移 > 30px 视为"扫过"，不触发滚动定位。
     阈值放宽以应对真实用户轻微抖动。 */
  var hoverIntent = { timer: null, x: 0, y: 0, targetId: null };
  function bindTargetAnchors(){
    // 事件委托：bound 一次后，flat 分页 append 的新引用行 / 气泡也自动生效
    var list = $('#cmList');
    if(!list || list.dataset.targetBound === '1') return;
    list.dataset.targetBound = '1';
    var SELECTOR = '.cm-reference[data-target-id], .cm-section-link[data-target-id], .cm-ref-bubble[data-target-id]';
    list.addEventListener('mouseenter', function(ev){
        var node = ev.target.closest && ev.target.closest(SELECTOR);
        if(!node) return;
        var targetId = parseInt(node.getAttribute('data-target-id'), 10);
        if(isNaN(targetId)) return;
        if(hoverIntent.timer){ clearTimeout(hoverIntent.timer); hoverIntent.timer = null; }
        clearHoverPreview();
        hoverIntent.x = ev.clientX; hoverIntent.y = ev.clientY;
        hoverIntent.targetId = targetId;
        hoverIntent.timer = setTimeout(function(){
          hoverIntent.timer = null;
          if(hoverIntent.targetId === targetId){
            scrollToTarget(targetId, true);
          }
        }, 200);
      }, true);
      list.addEventListener('mousemove', function(ev){
        var node = ev.target.closest && ev.target.closest(SELECTOR);
        if(!node) return;
        var targetId = parseInt(node.getAttribute('data-target-id'), 10);
        if(isNaN(targetId)) return;
        if(!hoverIntent.timer || hoverIntent.targetId !== targetId) return;
        var dx = Math.abs(ev.clientX - hoverIntent.x);
        var dy = Math.abs(ev.clientY - hoverIntent.y);
        if(dx + dy > 30){
          clearTimeout(hoverIntent.timer);
          hoverIntent.timer = null;
          hoverIntent.targetId = null;
        }
      }, true);
      list.addEventListener('mouseleave', function(ev){
        var node = ev.target.closest && ev.target.closest(SELECTOR);
        if(!node) return;
        var targetId = parseInt(node.getAttribute('data-target-id'), 10);
        if(isNaN(targetId)) return;
        if(hoverIntent.timer && hoverIntent.targetId === targetId){
          clearTimeout(hoverIntent.timer);
          hoverIntent.timer = null;
          hoverIntent.targetId = null;
        }
        clearHoverPreview();
      }, true);
      list.addEventListener('click', function(ev){
        var node = ev.target.closest && ev.target.closest(SELECTOR);
        if(!node) return;
        var targetId = parseInt(node.getAttribute('data-target-id'), 10);
        if(isNaN(targetId)) return;
        ev.stopPropagation();
        enterTargetView(targetId);
      });
  }

  // 7) 模式控制：评论模式开关
  var MODE_KEY = 'wb_comment_mode';
  function setCommentMode(on){
    document.body.classList.toggle('comment-mode', !!on);
    var btn = $('#rrComments');
    if(btn) btn.classList.toggle('active', !!on);
    if(on){
      // 每次进入都按编辑器最新内容重建阅读视图（段评气泡随之更新）
      renderReader();
      var drawer = $('#cmDrawer'); drawer.classList.add('open'); drawer.classList.remove('parasec');
      // 默认全部 tab
      switchCmTab('all');
      loadCommentData();
    } else {
      // 关闭后清掉高亮
      $$('.para').forEach(function(el){ el.classList.remove('active'); });
    }
    try{ localStorage.setItem(MODE_KEY, on?'1':'0'); }catch(e){}
  }

  function switchCmTab(name){
    var drawer = $('#cmDrawer');
    if(drawer.classList.contains('parasec')){
      // 段落视图模式下 tab 切换保持段视图
      return;
    }
    renderAllComments();
  }

  // 8) 初始化 + 事件绑定
  function init(){
    renderReader();

    var btn = $('#rrComments');
    btn.addEventListener('click', function(){
      var on = !document.body.classList.contains('comment-mode');
      setCommentMode(on);
    });

    $('#cmClose').addEventListener('click', function(){
      setCommentMode(false);
    });

    $$('#cmSort .cm-tab').forEach(function(tab){
      tab.addEventListener('click', function(){
        setCommentSort(tab.getAttribute('data-sort'));
      });
    });
    // 筛选 / 更多按钮不响应 click toggle：菜单走 hover 触发（PRD §18），无 selected 状态。
    var fb = $('#cmFilterBtn');
    if(fb) fb.addEventListener('click', function(ev){ ev.preventDefault(); });

    $('#cmBack').addEventListener('click', function(){
      returnToAllComments();
    });

    // 章评气泡 = 进入章评单对象视图（PRD §12-1）
    var cb = $('#chapBubble');
    if(cb) cb.addEventListener('click', function(){
      setCommentMode(true);
      enterTargetView(-1);
    });

    // 评论页默认直接进入评论（阅读）模式；?cm=para-N 可直接定位到某段
    setCommentMode(true);
    var qsCm = null;
    try{ qsCm = new URLSearchParams(location.search).get('cm'); }catch(e){}
    if(qsCm && /^para-\d+$/.test(qsCm)){
      var idx = +qsCm.split('-')[1];
      setTimeout(function(){ selectParagraph(idx); }, 30);
    }
  }

  // 此读者所有评论视图（PRD §19 / Figma 110-9333）：
  //   - 顶部 frame (Figma 110-9372)：8px 16px padding + 「用户 <guid> 的所有评论」+ 返回全部评论 pill；
  //   - 1 级评论列表：每条前置引用行 + 楼中楼收起；
  //   - 2 级回复：按父评论聚合，每组展示「引用 + 父评论 + 此读者的回复」(用普通 reply 样式)。
  function renderUserComments(guid){
    var list = $('#cmList');
    var context = $('#cmContext');
    var drawer = $('#cmDrawer');
    if(drawer) drawer.classList.remove('parasec');
    drawer.classList.add('usersec');
    currentUserGuid = guid;
    currentParagraphIdx = null;
    var allComments = COMMENT_DATA.comments || [];

    // 1 级评论
    var own1 = allComments.filter(function(c){
      return String(c.userGuid||'') === String(guid);
    });
    own1 = sortComments(own1);

    // 2 级回复按父评论聚合
    var own2ByParent = {};
    allComments.forEach(function(c){
      if(!c.replies) return;
      var mine = (c.replies || []).filter(function(r){
        return String(r.userGuid||'') === String(guid);
      });
      if(mine.length){
        var key = String(c.id != null ? c.id : (c.targetId+'-'+c.rowIndex));
        own2ByParent[key] = {parent: c, replies: mine};
      }
    });
    var own2List = Object.keys(own2ByParent).map(function(k){ return own2ByParent[k]; });
    own2List.sort(function(a,b){
      var d = (a.parent.targetId||0) - (b.parent.targetId||0);
      if(d !== 0) return d;
      return (a.parent.rowIndex||0) - (b.parent.rowIndex||0);
    });
    var replyTotal = own2List.reduce(function(s, x){ return s + x.replies.length; }, 0);
    var totalCount = own1.length + replyTotal;

    setCommentHeader('评论', totalCount + '条');
    // Figma 110-9372 引用 frame：用真实 guid 替换「用户昵称」占位
    var pTag = '<div class="cm-section-module single">'
      + '<div class="cm-quote">'
      +   '<span class="cm-quote-text">用户 '+escapeHtml(guid)+' 的所有评论</span>'
      +   '<button class="cm-quote-back" type="button">'
      +     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 10l-4 4 4 4"/><path d="M5 14h9a5 5 0 0 0 0-10h-2"/></svg>'
      +     '返回全部评论'
      +   '</button>'
      + '</div></div>';
    context.innerHTML = pTag;

    var idx = ensureCommentIndex();
    function quoteFor(targetId){
      var t = idx.targetMap[String(targetId)];
      var cnt = t ? t.totalCount : 0;
      return renderFullReference(targetId, getTargetText(targetId), cnt);
    }

    // 1 级评论（楼中楼收起）
    var s1 = own1.length
      ? own1.map(function(c, i){
          return quoteFor(c.targetId) + renderParagraphCommentItem(c, i, false);
        }).join('')
      : '<div class="cm-empty">该读者暂无 1 级评论</div>';

    // 2 级回复（按父评论聚合）
    var s2 = own2List.length
      ? own2List.map(function(item){
          var c = item.parent;
          var name = commentUser(c);
          var avColor = avatarColor(c.userGuid || name);
          var parentBlock = '<div class="cm-item" data-len="'+commentLength(c)+'">'
            + '<span class="av" data-guid="'+escapeHtml(String(c.userGuid||''))+'" style="background:'+avColor+'">'+escapeHtml(avatarInitial(name))+'</span>'
            + '<div class="body">'
            +   '<div class="nm-row"><span class="nm">'+escapeHtml(name)+'</span>'+(String(c.userGuid||'').endsWith('56')?'<span class="cm-user-badge">'+USER_BADGE_SVG+'</span>':'')+'</div>'
            +   '<div class="content">'+commentBodyHtml(c)+'</div>'
            +   commentMetaRow(c)
            + '</div></div>';
          var repliesBlock = item.replies.map(function(r){ return renderReplyItem(r); }).join('');
          return quoteFor(c.targetId) + parentBlock + repliesBlock;
        }).join('')
      : '<div class="cm-empty">该读者暂无 2 级回复</div>';

    list.innerHTML = s1 + s2 + '<div class="cm-empty">-到底了-</div>';
    var back = $('.cm-quote-back', context);
    if(back) back.addEventListener('click', returnToAllComments);
    bindReplyToggles();
    bindInspirationNoteButtons();
    bindTargetAnchors();
  }

  // PRD §18 全局 toast：菜单点击统一占位「开发中」
  var toastTimer = null;
  function showToast(text){
    var el = $('#cmToast');
    if(!el) return;
    el.textContent = text;
    el.setAttribute('data-open', '1');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){
      el.removeAttribute('data-open');
      toastTimer = null;
    }, 6000);
  }

  // PRD §18 hover 头像菜单（共享浮动 popover，避免给每个评论都渲染 5 行菜单 DOM）
  var avPopoverHideTimer = null;
  var avPopoverCurrentGuid = '';
  function fillAvPopover(guid){
    var popover = $('#cmAvPopover');
    if(!popover) return;
    popover.innerHTML = '<button class="cm-menu-item" data-action="user-all" type="button">查看此读者全部评论</button>'
      + '<button class="cm-menu-item" data-action="user-mute" type="button">禁言</button>';
    popover.dataset.guid = guid;
    avPopoverCurrentGuid = guid;
  }
  function showAvPopover(avEl){
    if(avPopoverHideTimer){ clearTimeout(avPopoverHideTimer); avPopoverHideTimer = null; }
    var guid = avEl.getAttribute('data-guid') || '';
    fillAvPopover(guid);
    var popover = $('#cmAvPopover');
    var r = avEl.getBoundingClientRect();
    popover.style.left = Math.round(r.left) + 'px';
    popover.style.top  = Math.round(r.bottom + 4) + 'px';
    popover.setAttribute('data-open', '1');
  }
  function hideAvPopover(){
    var popover = $('#cmAvPopover');
    if(popover) popover.removeAttribute('data-open');
  }
  function scheduleHideAvPopover(){
    if(avPopoverHideTimer) clearTimeout(avPopoverHideTimer);
    avPopoverHideTimer = setTimeout(function(){
      avPopoverHideTimer = null;
      hideAvPopover();
    }, 180);
  }
  // 菜单点击路由：MVP 阶段全部 toast「开发中」（PRD §18）。
  // 「查看此读者全部评论」路由已下线（原 renderUserComments 保留代码备用）。
  function handleMenuAction(action, ev){
    showToast('开发中');
  }

  // toolbar 菜单：点击 trigger 切换 .open；点 wrap 外部关闭；与兄弟 wrap 互斥；
  // 菜单项点击路由后自动关闭 wrap（复用 bindGlobalMenuEvents 里的全局 click）。
  // （原 hover 触发已移除：hover 穿越 4px 间隙会闪烁 + 误触发）
  function setupToolbarMenu(wrap, button){
    if(!wrap) return;
    function close(){ wrap.classList.remove('open'); }
    function open(){
      // 互斥：关闭其他已打开的 toolbar 菜单
      var wraps = document.querySelectorAll('.cm-menu-wrap.open');
      for(var i=0; i<wraps.length; i++){
        if(wraps[i] !== wrap) wraps[i].classList.remove('open');
      }
      wrap.classList.add('open');
    }
    // 点击按钮 → 切换
    if(button){
      button.addEventListener('click', function(ev){
        ev.stopPropagation();
        if(wrap.classList.contains('open')) close(); else open();
      });
    }
    // wrap 内部点击不需要 stopPropagation：document handler 用 closest('.cm-menu-wrap')
    // 判断已经在 wrap 内 → 直接 return；菜单项点击 → 进入 item 分支路由并关闭 wrap。
  }
  setupToolbarMenu($('#cmFilterWrap'), $('#cmFilterBtn'));
  setupToolbarMenu($('#cmMoreWrap'), $('#cmMoreBtn'));

  // 事件委托：menu-item 点击 → 路由 + 关闭父 wrap；avatar mouseover → 浮动 popover
  function bindGlobalMenuEvents(){
    document.addEventListener('click', function(ev){
      var item = ev.target.closest && ev.target.closest('.cm-menu-item');
      if(item){
        handleMenuAction(item.getAttribute('data-action'), ev);
        // toolbar 菜单项点击后关闭对应 wrap（cmAvPopover 不是 .cm-menu-item 链路，无影响）
        var w = item.closest('.cm-menu-wrap');
        if(w) w.classList.remove('open');
        return;
      }
      // 点 toolbar 菜单 wrap 外部（wrap 的 click 已 stopPropagation）→ 关闭所有 toolbar 菜单
      if(ev.target.closest && ev.target.closest('.cm-menu-wrap')) return;
      document.querySelectorAll('.cm-menu-wrap.open').forEach(function(w){ w.classList.remove('open'); });
    });
    document.addEventListener('mouseover', function(ev){
      var av = ev.target.closest && ev.target.closest('.cm-item .av, .cm-reply-item .av');
      if(av) showAvPopover(av);
    });
    document.addEventListener('mouseout', function(ev){
      var av = ev.target.closest && ev.target.closest('.cm-item .av, .cm-reply-item .av');
      if(!av) return;
      var to = ev.relatedTarget;
      if(to && (to.closest('#cmAvPopover') || to.closest('.cm-item .av') || to.closest('.cm-reply-item .av'))) return;
      scheduleHideAvPopover();
    });
    var popover = $('#cmAvPopover');
    if(popover){
      popover.addEventListener('mouseenter', function(){
        if(avPopoverHideTimer){ clearTimeout(avPopoverHideTimer); avPopoverHideTimer = null; }
      });
      popover.addEventListener('mouseleave', function(ev){
        var to = ev.relatedTarget;
        if(to && (to.closest('.cm-item .av') || to.closest('.cm-reply-item .av'))) return;
        scheduleHideAvPopover();
      });
    }
  }
  bindGlobalMenuEvents();

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
